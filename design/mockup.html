<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkStory AI — Design Mockup</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg-elev: #11141b;
    --panel: #151922;
    --panel-hover: #1a1f2b;
    --border: #232936;
    --border-strong: #2f3747;
    --text: #e6e9ef;
    --text-muted: #9aa3b2;
    --text-faint: #6b7385;
    --accent: #7c8cff;
    --accent-soft: rgba(124, 140, 255, 0.14);

    --inv-implemented: #34d399;
    --inv-collaborated: #2dd4bf;
    --inv-modified: #60a5fa;
    --inv-used: #a5b4fc;
    --inv-discussed: #fbbf24;
    --inv-mentioned: #6b7385;

    --high: #f472b6;
    --medium: #a78bfa;
    --low: #94a3b8;
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.1);
    --ok: #34d399;

    --radius: 10px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  a { color: var(--accent); text-decoration: none; }

  /* ---------- Layout ---------- */
  .app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
  .sidebar {
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    padding: 18px 12px;
    display: flex; flex-direction: column; gap: 22px;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, #7c8cff, #34d399);
    display: grid; place-items: center; font-weight: 700; color: #0b0d12; font-size: 13px;
  }
  .brand-name { font-weight: 650; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11.5px; color: var(--text-faint); }
  .nav-group-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-faint); padding: 0 10px; margin-bottom: 6px;
  }
  .nav-item {
    white-space: nowrap;
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 7px 10px; border-radius: 7px; border: 0; background: none;
    color: var(--text-muted); cursor: pointer; text-align: left;
  }
  .nav-item:hover { background: var(--panel); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--text); }
  .nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--text-faint); font-family: var(--mono); }
  .nav-item.disabled { opacity: 0.45; cursor: default; }
  .nav-item.disabled:hover { background: none; color: var(--text-muted); }
  .soon { margin-left: auto; flex: none; white-space: nowrap; font-size: 10px; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--border-strong); }
  .nav-icon { width: 16px; text-align: center; opacity: 0.8; }
  .sidebar-footer { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--border); }
  .profile-name { font-weight: 600; font-size: 13px; }
  .profile-meta { font-size: 12px; color: var(--text-faint); }

  .main { overflow-y: auto; }
  .page { max-width: 1180px; margin: 0 auto; padding: 28px 36px 60px; }
  .page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
  h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 4px; font-weight: 650; }
  .subtitle { color: var(--text-muted); margin: 0; }
  .stats { display: flex; gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 14px; min-width: 86px; }
  .stat-value { font-size: 18px; font-weight: 650; font-family: var(--mono); }
  .stat-label { font-size: 11.5px; color: var(--text-faint); }

  /* ---------- Filters ---------- */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px; margin-bottom: 18px;
  }
  .search {
    flex: 1 1 260px; display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0 10px;
  }
  .search input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); padding: 8px 0; font: inherit; }
  .search:focus-within { border-color: var(--accent); }
  select, .toggle {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font: inherit; cursor: pointer;
  }
  select:focus { outline: 1px solid var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--panel); border: 0; padding: 7px 11px; cursor: pointer; color: var(--text-muted); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--accent-soft); color: var(--text); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); user-select: none; }
  .toggle.on { color: var(--text); border-color: var(--inv-implemented); }
  .toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); }
  .toggle.on .dot { background: var(--inv-implemented); }
  .result-line { color: var(--text-faint); font-size: 12.5px; margin: -6px 2px 14px; }
  .result-line button { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }

  /* ---------- Cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 16px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 10px;
    transition: border-color .12s, background .12s, transform .12s;
  }
  .card:hover { border-color: var(--border-strong); background: var(--panel-hover); transform: translateY(-1px); }
  .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .card-title { font-weight: 620; font-size: 15px; letter-spacing: -0.01em; line-height: 1.35; }
  .card-summary { color: var(--text-muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11.5px; padding: 2px 8px; border-radius: 99px;
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-muted); white-space: nowrap;
  }
  .chip.cat { border-color: transparent; background: var(--accent-soft); color: #c3cbff; }
  .skill-chip { display: inline-flex; align-items: center; gap: 6px; }
  .inv-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .card-foot {
    display: flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 10px;
    border-top: 1px solid var(--border); font-size: 12px; color: var(--text-faint);
  }
  .card-foot .spacer { flex: 1; }
  .mono { font-family: var(--mono); }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border); white-space: nowrap; }
  .cx-high { color: var(--high); border-color: rgba(244,114,182,.35); }
  .cx-medium { color: var(--medium); border-color: rgba(167,139,250,.35); }
  .cx-low { color: var(--low); }
  .conf-low { color: var(--warn); border-color: rgba(251,191,36,.35); background: var(--warn-soft); }
  .conf-medium { color: var(--text-muted); }
  .conf-high { color: var(--ok); border-color: rgba(52,211,153,.3); }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-faint); border: 1px dashed var(--border); border-radius: var(--radius); }

  /* ---------- Detail ---------- */
  .back { background: none; border: 0; color: var(--text-muted); cursor: pointer; padding: 0; margin-bottom: 14px; }
  .back:hover { color: var(--text); }
  .detail-head { margin-bottom: 22px; }
  .detail-head .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 12px; }
  .detail-summary { color: var(--text-muted); font-size: 15px; max-width: 820px; margin: 0; }
  .detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  .section { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
  .section h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 600; }
  .section p { margin: 0; }
  .section ul { margin: 0; padding-left: 18px; }
  .section li + li { margin-top: 5px; }
  .callout { border-color: rgba(251,191,36,.35); background: var(--warn-soft); }
  .callout h3 { color: var(--warn); }
  .decision { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--bg-elev); }
  .decision + .decision { margin-top: 10px; }
  .decision-title { font-weight: 600; margin-bottom: 6px; }
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; font-size: 13px; }
  .kv dt { color: var(--text-faint); }
  .kv dd { margin: 0; color: var(--text-muted); }
  .ev-refs { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .pr-ref { font-family: var(--mono); font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 5px; }
  .challenge { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .challenge + .challenge { margin-top: 10px; }
  .challenge > div { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--text-muted); }
  .challenge .lbl { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; color: var(--text-faint); }
  .metric { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-elev); }
  .metric + .metric { margin-top: 8px; }
  .metric-vals { font-family: var(--mono); font-size: 16px; white-space: nowrap; }
  .metric-vals .arrow { color: var(--text-faint); margin: 0 6px; }
  .metric-vals .after { color: var(--ok); }
  .metric-name { font-weight: 550; }
  .metric-ev { font-size: 12px; color: var(--text-faint); }

  .side-skill { padding: 9px 0; border-top: 1px solid var(--border); }
  .side-skill:first-of-type { border-top: 0; padding-top: 0; }
  .side-skill-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .side-skill-ev { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
  .inv-badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid; }

  .timeline { position: relative; padding-left: 16px; }
  .timeline::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px; background: var(--border-strong); }
  .tl-item { position: relative; padding: 0 0 12px; }
  .tl-item::before { content: ""; position: absolute; left: -16px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--panel); }
  .tl-item.open::before { background: var(--accent); }
  .tl-item.closed::before { background: var(--text-faint); }
  .tl-title { font-size: 13px; }
  .tl-meta { font-size: 11.5px; color: var(--text-faint); font-family: var(--mono); }

  /* ---------- Skills ---------- */
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .skill-group { margin-bottom: 22px; }
  .skill-group h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); margin: 0 0 8px; font-weight: 600; }
  .skill-table { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .skill-row { display: grid; grid-template-columns: 220px 130px 1fr; gap: 14px; align-items: center; padding: 10px 14px; }
  .skill-row + .skill-row { border-top: 1px solid var(--border); }
  .skill-name { font-weight: 560; }
  .skill-alias { font-size: 11.5px; color: var(--text-faint); }
  .proj-link { cursor: pointer; }
  .proj-link:hover { border-color: var(--border-strong); color: var(--text); }

  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .cat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; }
  .cat-card:hover { border-color: var(--border-strong); }
  .cat-count { font-family: var(--mono); color: var(--text-faint); font-size: 12px; }

  .placeholder { text-align: center; padding: 90px 20px; color: var(--text-muted); }
  .placeholder .big { font-size: 40px; margin-bottom: 8px; }

  .design-note {
    position: fixed; right: 14px; bottom: 14px; font-size: 11.5px; color: var(--text-faint);
    background: var(--bg-elev); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px;
  }


  /* ---------- Compact / collapsible ---------- */
  .card-summary { -webkit-line-clamp: 2; }
  .cx { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-faint); white-space: nowrap; }
  .cx i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .fold { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; }
  .fold > summary { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  .fold > summary h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 600; }
  .fold > summary .n { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); }
  .fold > summary::after { content: "+"; margin-left: auto; color: var(--text-faint); font-size: 16px; }
  .fold[open] > summary::after { content: "–"; }
  .fold > .body { padding: 0 16px 14px; color: var(--text-muted); }
  .item { border-top: 1px solid var(--border); }
  .item > summary { padding: 9px 0; color: var(--text); display: flex; gap: 8px; }
  .item > summary::before { content: "›"; color: var(--text-faint); transition: transform .1s; }
  .item[open] > summary::before { transform: rotate(90deg); }
  .item > .item-body { padding: 0 0 12px 14px; font-size: 13px; }
  .metric-row { display: flex; align-items: baseline; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); }
  .metric-row:first-child { border-top: 0; }
  .side-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; }
  .pr-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
  .pr-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ok); }
  .pr-dot.closed { background: var(--text-faint); }
  .pr-dot.open { background: var(--accent); }
  .pr-row .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .skill-line > summary { display: grid; grid-template-columns: 1fr 130px 90px; gap: 14px; align-items: center; padding: 10px 14px; }
  .skill-line + .skill-line { border-top: 1px solid var(--border); }
  .skill-line > summary:hover { background: var(--panel-hover); }
  .skill-line .chips { padding: 0 14px 12px; }
  .cat-card { display: flex; justify-content: space-between; align-items: center; }

  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .detail-grid { grid-template-columns: 1fr; }
    .page { padding: 20px 16px 50px; }
    .page-header { flex-direction: column; align-items: flex-start; }
    .skill-line > summary { grid-template-columns: 1fr auto; }
    .skill-line > summary .cnt { display: none; }
    .challenge { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">W</div>
      <div><div class="brand-name">WorkStory AI</div></div>
    </div>

    <nav>
      <div class="nav-group-label">My Experience</div>
      <button class="nav-item" data-view="projects"><span class="nav-icon">▦</span>Projects<span class="count" id="nav-projects"></span></button>
      <button class="nav-item" data-view="skills"><span class="nav-icon">◆</span>Skills<span class="count" id="nav-skills"></span></button>
      <button class="nav-item" data-view="categories"><span class="nav-icon">▤</span>Categories<span class="count" id="nav-categories"></span></button>
    </nav>
    <nav>
      <div class="nav-group-label">Assistant</div>
      <button class="nav-item" data-view="assistant"><span class="nav-icon">✦</span>Ask my experience<span class="soon">Stage 2</span></button>
    </nav>
    <nav>
      <div class="nav-group-label">Interview Prep</div>
      <button class="nav-item" data-view="prep"><span class="nav-icon">◎</span>Role-based<span class="soon">Stage 3</span></button>
      <button class="nav-item" data-view="prep"><span class="nav-icon">◎</span>JD-based<span class="soon">Stage 3</span></button>
      <button class="nav-item" data-view="prep"><span class="nav-icon">◎</span>Project deep-dives<span class="soon">Stage 3</span></button>
    </nav>

    <div class="sidebar-footer">
      <div class="profile-name" id="profile-name"></div>
      <div class="profile-meta" id="profile-meta"></div>
    </div>
  </aside>

  <main class="main"><div class="page" id="page"></div></main>
</div>
<div class="design-note">Design mockup · sample data</div>

<script>
const DATA = {"metadata": {"schema_version": "1.0", "owner_name": "Alex Rivera", "generated_at": "2026-11-26T10:00:00Z", "data_source": "Synthetic sample data (fictional engineer, company and repositories)", "sanitised": true}, "professional_summary": {"summary": "Backend engineer with about 3.5 years of experience building Python and Node.js services for a B2B logistics platform. Focus on data migrations, reliable integrations, API performance and, more recently, LLM-based internal tooling.", "experience_level": "3-4 years", "primary_roles": ["Backend Engineer", "Python Developer"], "primary_technologies": ["Python", "FastAPI", "PostgreSQL", "Node.js", "TypeScript", "GCP"]}, "projects": [{"id": "proj-tracking-postgres-migration", "name": "Shipment tracking migration from MongoDB to PostgreSQL", "summary": "Moved the shipment tracking history store from MongoDB to PostgreSQL with zero downtime using dual writes, a throttled backfill and a feature-flagged read switch.", "problem": "Tracking history lived in MongoDB while the rest of the shipment data was in PostgreSQL. Cross-store queries were done in application code, which made the tracking timeline endpoint slow and made reporting queries impossible to write in SQL.", "context": "Tracking events arrive from many carriers with different payload shapes. The tracking timeline is one of the most used customer-facing endpoints, so downtime was not acceptable.", "objectives": ["Store tracking events in PostgreSQL next to shipments.", "Migrate existing history without downtime or data loss.", "Make tracking timeline queries faster."], "my_contributions": ["Designed the new tracking_events table, including a JSONB column for carrier-specific payloads.", "Implemented the dual-write layer so new events were written to both MongoDB and PostgreSQL.", "Wrote the batched backfill job with validation and a quarantine table for malformed documents.", "Switched reads to PostgreSQL behind a feature flag and led the cutover.", "Removed the MongoDB write path after the verification period."], "implementation": "Python service using SQLAlchemy models and Alembic migrations. New events were written to both stores through a repository class that hid the dual write from callers. The backfill read MongoDB in batches ordered by _id, validated and normalised each document, and inserted with ON CONFLICT DO NOTHING so it could be safely re-run. A feature flag switched the timeline endpoint to read from PostgreSQL per tenant, which allowed a gradual rollout.", "architecture": "Shipments API (FastAPI) -> TrackingRepository -> PostgreSQL (primary) with temporary dual write to MongoDB. Backfill runs as a separate one-off job. Reads are routed by a per-tenant feature flag during rollout.", "challenges": [{"challenge": "Older MongoDB documents were inconsistent: missing fields, mixed timestamp formats and duplicated events.", "solution": "Added a validation step in the backfill that normalised timestamps to UTC, de-duplicated by (shipment_id, carrier_event_id), and moved unfixable documents to a quarantine table for manual review."}, {"challenge": "Running the backfill against the production database risked slowing down live traffic.", "solution": "Processed data in batches of 5,000 with keyset pagination and a configurable sleep between batches, and ran it outside peak hours."}], "decisions": [{"context": "The migration had to happen without downtime on a heavily used endpoint.", "decision": "Use dual writes, then backfill, then switch reads behind a per-tenant feature flag.", "reasoning": "Each step could be verified and rolled back independently, and rollout could start with low-traffic tenants.", "alternatives": ["Big-bang migration in a maintenance window", "Change data capture from MongoDB"], "tradeoffs": "Temporary extra write latency and code complexity while both stores were kept in sync.", "pr_ids": ["pr-shipments-api-308", "pr-shipments-api-322"]}, {"context": "Each carrier sends tracking events wi nt was slow or down, the event was lost and the original request became slow.", "context": "Customers rely on webhooks to update their own systems when a shipment status changes. Roughly 50,000 webhooks were sent per day.", "objectives": ["Stop losing webhooks when customer endpoints fail.", "Remove webhook sending from the request path.", "Give customers a way to detect duplicate deliveries."], "my_contributions": ["Proposed and implemented the PostgreSQL-backed delivery queue using an outbox table.", "Implemented the retry worker with exponential backoff and jitter.", "Added the dead-letter table and an internal endpoint to replay failed deliveries.", "Added idempotency keys to webhook payloads and documented them for customers.", "Wrote unit and integration tests for retry scheduling and worker concurrency."], "implementation": "The request handler inserts a delivery row into an outbox table in the same transaction as the status change. Worker processes claim rows using SELECT ... FOR UPDATE SKIP LOCKED, send the HTTP request with a timeout, and on failure reschedule with exponential backoff and jitter (up to 8 attempts over about 24 hours). After the final attempt the row moves to a dead-letter table. Each payload carries an Idempotency-Key header derived from the event ID.", "architecture": "Shipments API writes to an outbox table -> worker processes in notifications-service poll and claim jobs with SKIP LOCKED -> customer endpoints. Failed jobs go to a dead-letter table that can be replayed through an internal API.", "challenges": [{"challenge": "Multiple workers could pick up the same job and send duplicate webhooks.", "solution": "Used FOR UPDATE SKIP LOCKED to claim jobs atomically, and added idempotency keys so customers can safely ignore any remaining duplicates."}, {"challenge": "A single customer endpoint that was down generated a large number of retries.", "solution": "Capped attempts and added jitter so retries were spread out instead of arriving in b ", "category": "Backend"}, {"name": "PostgreSQL", "category": "Databases", "aliases": ["Postgres", "psql"]}, {"name": "MongoDB", "category": "Databases", "aliases": ["Mongo"]}, {"name": "Redis", "category": "Databases"}, {"name": "Alembic", "category": "Databases", "description": "Database schema migrations for SQLAlchemy."}, {"name": "pgvector", "category": "Databases"}, {"name": "Kafka", "category": "Messaging", "aliases": ["Apache Kafka"]}, {"name": "Docker", "category": "Infrastructure"}, {"name": "GCP", "category": "Infrastructure", "aliases": ["Google Cloud"]}, {"name": "Cloud Run", "category": "Infrastructure"}, {"name": "OpenTelemetry", "category": "Infrastructure", "aliases": ["OTel"]}, {"name": "LLMs", "category": "AI/GenAI", "aliases": ["LLM", "Large Language Models"]}, {"name": "RAG", "category": "AI/GenAI", "aliases": ["Retrieval-Augmented Generation"]}, {"name": "Embeddings", "category": "AI/GenAI"}, {"name": "Prompt Engineering", "category": "AI/GenAI"}, {"name": "Cross-encoder Reranking", "category": "AI/GenAI", "aliases": ["Reranking"]}, {"name": "Pytest", "category": "Testing"}], "categories": [{"name": "Backend Engineering"}, {"name": "API Development"}, {"name": "Database Design & Migration"}, {"name": "System Design"}, {"name": "Performance Optimisation"}, {"name": "Reliability & Observability"}, {"name": "Cloud & Infrastructure"}, {"name": "AI & GenAI"}, {"name": "Third-party Integrations"}, {"name": "Developer Productivity"}, {"name": "Testing & Quality Engineering"}]};

// ---------- Derived data ----------
const INV_ORDER = ["implemented", "collaborated", "modified", "used", "discussed", "mentioned"];
const INV_LABEL = {
  implemented: "Implemented", collaborated: "Collaborated", modified: "Modified",
  used: "Used", discussed: "Discussed only", mentioned: "Mentioned only",
};
const STRONG = new Set(["implemented", "collaborated"]);
const prsById = Object.fromEntries(DATA.pull_requests.map(pr => [pr.id, pr]));
const skillsByName = Object.fromEntries(DATA.skills.map(s => [s.name, s]));

for (const p of DATA.projects) {
  for (const k of ["objectives", "challenges", "decisions", "metrics", "uncertainties", "skills", "pr_ids"]) p[k] ||= [];
  const prs = p.pr_ids.map(id => prsById[id]).sort((a, b) => a.created_at.localeCompare(b.created_at));
  p._prs = prs;
  p._start = prs.length ? prs[0].created_at : null;
  p._last = prs.length ? prs.map(pr => pr.merged_at || pr.created_at).sort().at(-1) : null;
  p.skills.sort((a, b) => INV_ORDER.indexOf(a.involvement) - INV_ORDER.indexOf(b.involvement));
}

// ---------- Helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const invColor = inv => `var(--inv-${inv})`;
const fmtMonth = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-GB", { month: "short", year: "numeric" }) : "—";
const range = p => p._start ? (fmtMonth(p._start) === fmtMonth(p._last) ? fmtMonth(p._start) : `${fmtMonth(p._start)} – ${fmtMonth(p._last)}`) : "No PRs";
const cxBadge = c => `<span class="badge cx-${c}">${c[0].toUpperCase() + c.slice(1)} complexity</span>`;
const confBadge = c => `<span class="badge conf-${c}">${c === "low" ? "⚠ " : ""}${c[0].toUpperCase() + c.slice(1)} confidence</span>`;
const invBadge = inv => `<span class="inv-badge" style="color:${invColor(inv)};border-color:${invColor(inv)}55">${INV_LABEL[inv]}</span>`;
const prRefs = ids => ids?.length ? `<div class="ev-refs">${ids.map(id => `<span class="pr-ref" title="${esc(prsById[id]?.title)}">${esc(prsById[id]?.repo)}#${id.split("-").at(-1)}</span>`).join("")}</div>` : "";

// ---------- State ----------
const state = { view: "projects", projectId: null, q: "", skill: "", category: "", complexity: "all", strongOnly: false, sort: "recent" };

function go(view, extra = {}) {
  Object.assign(state, { view, projectId: null }, extra);
  render();
  document.querySelector(".main").scrollTop = 0;
}

// ---------- Views ----------
function filteredProjects() {
  const q = state.q.trim().toLowerCase();
  let list = DATA.projects.filter(p => {
    if (q) {
      const hay = [p.name, p.summary, p.problem, p.implementation, ...p.my_contributions, JSON.stringify(p.decisions)].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (state.skill) {
      const link = p.skills.find(s => s.name === state.skill);
      if (!link) return false;
      if (state.strongOnly && !STRONG.has(link.involvement)) return false;
    } else if (state.strongOnly && !p.skills.some(s => STRONG.has(s.involvement))) return false;
    if (state.category && !p.categories.includes(state.category)) return false;
    if (state.complexity !== "all" && p.complexity !== state.complexity) return false;
    return true;
  });
  const cx = { high: 0, medium: 1, low: 2 };
  if (state.sort === "recent") list.sort((a, b) => (b._last || "").localeCompare(a._last || ""));
  if (state.sort === "complexity") list.sort((a, b) => cx[a.complexity] - cx[b.complexity] || a.name.localeCompare(b.name));
  if (state.sort === "name") list.sort((a, b) => a.name.localeCompare(b.name));
  return list;
}

const CX_COLOR = { high: "var(--high)", medium: "var(--medium)", low: "var(--low)" };
const cx = c => `<span class="cx"><i style="background:${CX_COLOR[c]}"></i>${c[0].toUpperCase() + c.slice(1)}</span>`;
const lowConf = c => c === "low" ? `<span class="badge conf-low" title="Low confidence">⚠ Unverified</span>` : "";
const prNum = pr => `#${pr.id.split("-").at(-1)}`;

function projectCard(p) {
  const shown = p.skills.slice(0, 3);
  const more = p.skills.length - shown.length;
  return `
    <article class="card" data-project="${p.id}">
      <div class="card-top">
        <div class="card-title">${esc(p.name)}</div>
        ${cx(p.complexity)}
      </div>
      <p class="card-summary">${esc(p.summary)}</p>
      <div class="chips">
        ${shown.map(s => `<span class="chip skill-chip" title="${INV_LABEL[s.involvement]}"><span class="inv-dot" style="background:${invColor(s.involvement)}"></span>${esc(s.name)}</span>`).join("")}
        ${more > 0 ? `<span class="chip">+${more}</span>` : ""}
      </div>
      <div class="card-foot">
        <span class="mono">${p._prs.length} PRs</span><span>${range(p)}</span>
        <span class="spacer"></span>${lowConf(p.confidence)}
      </div>
    </article>`;
}

function renderProjects() {
  const list = filteredProjects();
  const skillOptions = [...DATA.skills].sort((a, b) => a.name.localeCompare(b.name));
  const anyFilter = state.q || state.skill || state.category || state.complexity !== "all" || state.strongOnly;
  return `
    <div class="page-header">
      <h1>Projects</h1>
      <div class="stats">
        <div class="stat"><div class="stat-value">${DATA.projects.length}</div><div class="stat-label">Projects</div></div>
        <div class="stat"><div class="stat-value">${DATA.pull_requests.length}</div><div class="stat-label">PRs</div></div>
        <div class="stat"><div class="stat-value">${DATA.skills.length}</div><div class="stat-label">Skills</div></div>
      </div>
    </div>
    <div class="toolbar">
      <label class="search"><span style="color:var(--text-faint)">⌕</span>
        <input id="q" placeholder="Search…" value="${esc(state.q)}"></label>
      <select id="skill"><option value="">Skill</option>${skillOptions.map(s => `<option ${s.name === state.skill ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select>
      <select id="category"><option value="">Category</option>${DATA.categories.map(c => `<option ${c.name === state.category ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
      <div class="seg" id="complexity">${["all", "high", "medium", "low"].map(c => `<button data-v="${c}" class="${state.complexity === c ? "on" : ""}">${c === "all" ? "Any" : c[0].toUpperCase() + c.slice(1)}</button>`).join("")}</div>
      <button class="toggle ${state.strongOnly ? "on" : ""}" id="strong" title="Only implemented or collaborated work"><span class="dot"></span>Hands-on</button>
      <select id="sort">
        <option value="recent" ${state.sort === "recent" ? "selected" : ""}>Recent</option>
        <option value="complexity" ${state.sort === "complexity" ? "selected" : ""}>Complexity</option>
        <option value="name" ${state.sort === "name" ? "selected" : ""}>Name</option>
      </select>
    </div>
    ${anyFilter ? `<div class="result-line">${list.length} of ${DATA.projects.length} · <button id="clear">Clear</button></div>` : ""}
    ${list.length ? `<div class="grid">${list.map(projectCard).join("")}</div>`
      : `<div class="empty">No matching projects.${state.skill && state.strongOnly ? `<br>${esc(state.skill)} appears in your data, but not as hands-on work.` : ""}</div>`}`;
}

function renderDetail() {
  const p = DATA.projects.find(x => x.id === state.projectId);
  const fold = (title, body, { open = false, n = null } = {}) => body
    ? `<details class="fold" ${open ? "open" : ""}><summary><h3>${title}</h3>${n !== null ? `<span class="n">${n}</span>` : ""}</summary><div class="body">${body}</div></details>` : "";
  const ul = items => items.length ? `<ul style="margin:0;padding-left:18px">${items.map(i => `<li style="margin:4px 0">${esc(i)}</li>`).join("")}</ul>` : "";

  const decisions = p.decisions.map(d => `
    <details class="item"><summary>${esc(d.decision)}</summary><div class="item-body">
      <dl class="kv">
        <dt>Why</dt><dd>${esc(d.reasoning)}</dd>
        ${d.alternatives?.length ? `<dt>Instead of</dt><dd>${d.alternatives.map(esc).join(" · ")}</dd>` : ""}
        ${d.tradeoffs ? `<dt>Trade-off</dt><dd>${esc(d.tradeoffs)}</dd>` : ""}
      </dl>${prRefs(d.pr_ids)}
    </div></details>`).join("");

  const challenges = p.challenges.map(c => `
    <details class="item"><summary>${esc(c.challenge)}</summary><div class="item-body">→ ${esc(c.solution)}</div></details>`).join("");

  const metrics = p.metrics.map(m => `
    <div class="metric-row" title="${esc(m.evidence)}">
      <span class="metric-vals">${m.before ?? "—"}<span class="arrow">→</span><span class="after">${m.after ?? "—"}</span> <span style="font-size:12px;color:var(--text-faint)">${esc(m.unit || "")}</span></span>
      <span>${esc(m.name)}</span>
    </div>`).join("");

  const skills = p.skills.map(sk => `
    <div class="side-row" title="${esc(sk.evidence)}"><span>${esc(sk.name)}</span>${invBadge(sk.involvement)}</div>`).join("");

  return `
    <button class="back" id="back">← Projects</button>
    <div class="detail-head">
      <h1>${esc(p.name)}</h1>
      <div class="badges">${cx(p.complexity)}${lowConf(p.confidence)}<span class="badge">${p._prs.length} PRs · ${range(p)}</span></div>
      <p class="detail-summary">${esc(p.summary)}</p>
    </div>
    <div class="detail-grid">
      <div>
        ${p.uncertainties.length ? `<section class="section callout"><h3>⚠ Unverified</h3>${ul(p.uncertainties)}</section>` : ""}
        ${fold("My contributions", ul(p.my_contributions), { open: true, n: p.my_contributions.length })}
        ${fold("Problem", `<p style="margin:0">${esc(p.problem)}</p>`)}
        ${fold("How it works", `<p style="margin:0">${esc(p.implementation)}</p>${p.architecture ? `<p class="mono" style="margin:10px 0 0;font-size:12px">${esc(p.architecture)}</p>` : ""}`)}
        ${fold("Decisions", decisions, { n: p.decisions.length })}
        ${fold("Challenges", challenges, { n: p.challenges.length })}
        ${fold("Outcomes", metrics, { open: true, n: p.metrics.length })}
      </div>
      <aside>
        <section class="section"><h3>Skills</h3>${skills}</section>
      </aside>
    </div>`;
}

function renderSkills() {
  const links = {};
  for (const p of DATA.projects) for (const sk of p.skills) (links[sk.name] ||= []).push({ p, inv: sk.involvement });
  const groups = {};
  for (const sk of DATA.skills) (groups[sk.category] ||= []).push(sk);

  const line = sk => {
    const l = (links[sk.name] || []).sort((a, b) => INV_ORDER.indexOf(a.inv) - INV_ORDER.indexOf(b.inv));
    return `
      <details class="skill-line">
        <summary><span class="skill-name">${esc(sk.name)}</span><span>${l[0] ? invBadge(l[0].inv) : ""}</span><span class="cnt mono" style="font-size:12px;color:var(--text-faint);text-align:right">${l.length} project${l.length === 1 ? "" : "s"}</span></summary>
        <div class="chips">${l.map(({ p, inv }) => `<span class="chip skill-chip proj-link" data-project="${p.id}"><span class="inv-dot" style="background:${invColor(inv)}"></span>${esc(p.name)}</span>`).join("")}</div>
      </details>`;
  };

  return `
    <div class="page-header"><h1>Skills</h1></div>
    <div class="legend">${INV_ORDER.map(i => `<span><span class="inv-dot" style="background:${invColor(i)}"></span>${INV_LABEL[i]}</span>`).join("")}</div>
    ${Object.entries(groups).map(([g, list]) => `
      <div class="skill-group"><h2>${esc(g)}</h2><div class="skill-table">${list.map(line).join("")}</div></div>`).join("")}`;
}

function renderCategories() {
  return `
    <div class="page-header"><h1>Categories</h1></div>
    <div class="cat-grid">${DATA.categories.map(c => {
      const n = DATA.projects.filter(p => p.categories.includes(c.name)).length;
      return `<div class="cat-card" data-category="${esc(c.name)}"><b style="font-weight:560">${esc(c.name)}</b><span class="cat-count">${n}</span></div>`;
    }).join("")}</div>`;
}

function renderPlaceholder(title, stage, text) {
  return `<div class="placeholder"><div class="big">✦</div><h1>${title}</h1><p class="subtitle">${text}</p><p style="color:var(--text-faint);margin-top:14px">Coming in ${stage}</p></div>`;
}

// ---------- Render + events ----------
function render() {
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.view === (state.view === "detail" ? "projects" : state.view)));
  const page = document.getElementById("page");
  page.innerHTML =
    state.view === "projects" ? renderProjects() :
    state.view === "detail" ? renderDetail() :
    state.view === "skills" ? renderSkills() :
    state.view === "categories" ? renderCategories() :
    state.view === "assistant" ? renderPlaceholder("Ask my experience", "Stage 2", "Questions about your work, answered with evidence.") :
    renderPlaceholder("Interview Prep", "Stage 3", "Interview questions grounded in your projects.");
  bind();
}

function bind() {
  document.querySelectorAll("[data-project]").forEach(el => el.onclick = () => go("detail", { projectId: el.dataset.project }));
  document.querySelectorAll("[data-category]").forEach(el => el.onclick = () => go("projects", { category: el.dataset.category }));
  const $ = id => document.getElementById(id);
  if ($("back")) $("back").onclick = () => go("projects");
  if ($("q")) $("q").oninput = e => { state.q = e.target.value; const pos = e.target.selectionStart; render(); $("q").focus(); $("q").setSelectionRange(pos, pos); };
  if ($("skill")) $("skill").onchange = e => { state.skill = e.target.value; render(); };
  if ($("category")) $("category").onchange = e => { state.category = e.target.value; render(); };
  if ($("sort")) $("sort").onchange = e => { state.sort = e.target.value; render(); };
  if ($("strong")) $("strong").onclick = () => { state.strongOnly = !state.strongOnly; render(); };
  if ($("clear")) $("clear").onclick = () => { Object.assign(state, { q: "", skill: "", category: "", complexity: "all", strongOnly: false }); render(); };
  document.querySelectorAll("#complexity button").forEach(b => b.onclick = () => { state.complexity = b.dataset.v; render(); });
}

document.querySelectorAll(".nav-item").forEach(n => n.onclick = () => go(n.dataset.view));
document.getElementById("nav-projects").textContent = DATA.projects.length;
document.getElementById("nav-skills").textContent = DATA.skills.length;
document.getElementById("nav-categories").textContent = DATA.categories.length;
document.getElementById("profile-name").textContent = DATA.metadata.owner_name;
document.getElementById("profile-meta").textContent = DATA.professional_summary.experience_level + " · " + DATA.professional_summary.primary_roles[0];
const [hv, hid] = location.hash.slice(1).split("=");
if (hv === "project" && DATA.projects.some(p => p.id === hid)) Object.assign(state, { view: "detail", projectId: hid });
else if (["skills", "categories", "assistant", "prep"].includes(hv)) state.view = hv;
render();
</script>
</body>
</html>
